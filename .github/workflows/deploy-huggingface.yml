name: Deploy to Hugging Face Space

# Mirrors the app source to the Hugging Face Space (sayskar500/lumina-plane),
# where HF builds the Dockerfile and runs it on the free CPU tier.
#
# One-time setup (see docs/HUGGINGFACE.md):
#   1. Create a Docker Space named `lumina-plane` on huggingface.co
#   2. Add the HF access token (write) as the GitHub secret HF_TOKEN
#   3. Add MONGO_URI and GROQ_API_KEY as Space secrets
#
# Safety: only app source ships to the Space — never tfvars, state, or
# secrets.yaml (all gitignored anyway, but the allowlist below is explicit).

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile.server"
      - "go.mod"
      - "go.sum"
      - "huggingface/**"
      - ".github/workflows/deploy-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Space content
        run: |
          SPACE_DIR="$RUNNER_TEMP/space"
          mkdir -p "$SPACE_DIR/config"

          # Explicit allowlist — app source and build files only.
          cp -R cmd internal "$SPACE_DIR/"
          cp go.mod go.sum "$SPACE_DIR/"
          cp Dockerfile.server "$SPACE_DIR/Dockerfile"
          cp config/config.yaml "$SPACE_DIR/config/"
          cp huggingface/space-README.md "$SPACE_DIR/README.md"

          echo "Space content:"
          find "$SPACE_DIR" -type f | sort

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "ℹ️ HF_TOKEN not set — skipping Space sync (see docs/HUGGINGFACE.md)"
            exit 0
          fi
          cd "$RUNNER_TEMP/space"
          git init -b main
          git config user.name "lumina-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "Sync from GitHub ${GITHUB_SHA}"
          git push -f "https://sayskar500:${HF_TOKEN}@huggingface.co/spaces/sayskar500/lumina-plane" main
